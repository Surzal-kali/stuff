# =============================================================================
# Framework workbench: Open Terminal + Open WebUI + JupyterLab (nursery) + ChromaDB
#
# NETWORK POSTURE (2026-09-17, user decision "C"): the iptables lockdown is
# GONE — no NET_ADMIN caps, no cage, on any service. Rationale: the framework
# is the scope-lined gateway to the outside world (check_scope / .scope files /
# RoE headers enforce program scope in-process), and the only consumer the
# cage ever actually restricted was the secretary chat loop. The cage also
# collided with the workbench topology: the gateway+brain run INSIDE the
# open-terminal container, so LOCKDOWN_NETWORK caged the framework's own
# target lanes (inspect_host, amass, ZAP, nmap vs real hosts) along with the
# shell. Scope discipline is now purely the in-process layer + operator RoE.
#
# open-terminal bind-mounts the live production tree (no COPY) and hosts the
# framework gateway (:6000) + Brain sidecar; its shell is the agent runtime.
#
# JupyterLab (the tool nursery) shares the live framework tree and reaches the
# gateway on the workbench subnet; with the cage gone it can also be proxied
# for remote access. Still localhost-only at the port level (127.0.0.1:8888)
# and JUPYTER_TOKEN-gated.
#
# Open WebUI is the open chat frontend: it does its own web search and calls
# the framework's API routes for tool/code execution.
#
# ChromaDB is defined below as the `chroma` service — it mirrors the previous
# standalone `chroma` container (same image, same config.yaml, same `chroma-data`
# bind mount, host port 9000).  open-terminal reaches it by DNS name `chroma`
# on the workbench network.  See the note above the service block about removing
# the standalone container first.
#
# Usage:
#   cd dockered
#   ./up.sh                  # builds + starts (removes legacy chroma first)
#
#   # or manually:
#   docker rm -f chroma       # clear the standalone container if present
#   docker compose up -d --build
#
# Open Terminal API:  http://localhost:8000   (connect Open WebUI here)
# Framework gateway:  http://localhost:6000   (REST + MCP, from host)
# Open WebUI:         http://localhost:3000   (chat front end)
# JupyterLab:         http://localhost:8888   (dev/automation IDE, localhost-only)
#
# open-terminal now bind-mounts the live production tree (..) at /opt/framework
# instead of baking a COPY, so code edits on the host are picked up with no
# rebuild. Note: .dockerignore does NOT apply to bind mounts — .git/ and any
# non-ignored host files become visible inside the container.
#
# Override API keys / tokens via shell env or a dockered/.env file:
#   OPEN_TERMINAL_API_KEY=your-key
#   GATEWAY_API_KEY=your-key
#   JUPYTER_TOKEN=your-token
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────
  # ChromaDB — mirrored from the existing standalone `chroma` container so the
  # workbench is self-contained.  Service name `chroma` is the DNS name on the
  # workbench network, matching CHROMA_HOST=chroma in framework.env.
  #
  # Before `docker compose up`, stop/remove the standalone container to avoid a
  # host port-9000 / container-name collision:
  #   docker rm -f chroma
  # ─────────────────────────────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma
    command: ["run", "/config.yaml"]
    ports:
      - "9000:8000"      # host 9000 -> container 8000 (matches existing mapping)
    networks:
      workbench:
        ipv4_address: 172.28.0.10
    volumes:
      - ../chroma-data:/data          # reuse the existing on-disk vector store
      - ./chroma-config.yaml:/config.yaml:ro
    restart: unless-stopped

  open-terminal:
    build:
      context: ..
      dockerfile: dockered/open-terminal.Dockerfile
    ports:
      - "8000:8000"    # Open Terminal API (connect Open WebUI here)
      - "6000:6000"    # Framework REST + MCP gateway (debug from host)
    networks:
      workbench:
        ipv4_address: 172.28.0.20
    env_file:
      - .env
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      # Chroma is reached on the compose network by service name + internal
      # port (container listens on 8000; 9000 is only the host-published map).
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      # Ollama lives on the Windows lab host (10.10.10.128); /v1 = OpenAI-compat
      - OLLAMA_BASE_URL=http://10.10.10.128:11434/v1
      # Point Open WebUI's file browser at the live production code bind mount
      # (..:/opt/framework) instead of the default `home` (/home/user). The
      # default root seeds the named volume with the open-terminal package's
      # home dir, so Open WebUI only ever saw the package — never the framework.
      # /opt/framework matches WORKSPACE_ROOT in framework.env, so the browser,
      # the terminal CWD, and the framework all agree on one workspace root.
      - OPEN_TERMINAL_FILE_BROWSER_ROOT=/opt/framework
    volumes:
      - terminal-workspace:/home/user        # agent workspace (ephemeral files)
      - /home/surzal/stuff:/opt/framework       # live production code (bind mount, replaces COPY)
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Open WebUI — chat front end layered over the framework.
  # Reaches open-terminal at open-terminal:8000 (tools) and Ollama directly at
  # 10.10.10.128:11434 (LLM, host lane enp92s0 — the lab-switch lane is routed
  # and SNATed downwind, so containers reach it through the host). Not behind
  # the open-terminal firewall — this is the open dev surface, not the gated
  # agent surface.
  # ─────────────────────────────────────────────────────────────────────────
  open-webui:
    # NOTE: pinned to :dev (not :main) because the interactive terminal shell
    # is broken in the current stable release v0.11.3. Open WebUI's WebSocket
    # proxy omits the X-User-Id / X-Session-Id headers that open-terminal's
    # attach handler checks, so every interactive PTY attach is closed with
    # 4004 "Session not found" (REST/file-browser/AI tool calls still work).
    # Fixed in dev: see open-webui/open-webui#29787. Switch back to :main once
    # a stable release newer than v0.11.3 ships (0.11.4+).
    image: ghcr.io/open-webui/open-webui:dev
    ports:
      - "3000:8080"
    networks:
      workbench:
        ipv4_address: 172.28.0.30
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://10.10.10.128:11434
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
      - WEBUI_URL_PREFIX=${WEBUI_URL_PREFIX}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}

    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: bloodhound-postgres
    networks:
      - workbench
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bloodhound
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:4.4-community
    container_name: bloodhound-neo4j
    networks:
      - workbench
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  bloodhound:
    image: specterops/bloodhound:latest
    container_name: bloodhound-server
    networks:
      - workbench
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      # BloodHound CE reads DB config via individual field env vars (see
      # cmd/api/src/config/config_test.go in SpecterOps/BloodHound). Using
      # the field vars (bhe_database_*, bhe_neo4j_*) instead of a full
      # connection string avoids URL-encoding issues when the password
      # contains URI-special characters like '@'.
      bhe_database_addr: "postgres:5432"
      bhe_database_username: "bloodhound"
      bhe_database_secret: "${POSTGRES_PASSWORD}"
      bhe_database_database: "bloodhound"
      bhe_neo4j_addr: "neo4j:7687"
      bhe_neo4j_username: "neo4j"
      bhe_neo4j_secret: "${NEO4J_PASSWORD}"
      bhe_neo4j_database: "neo4j"

      # General settings
      bhe_log_level: INFO
      bhe_root_url: "http://localhost:${BLOODHOUND_PORT}"
    ports:
      # Pulls port variable dynamically while maintaining your safe port layout
      - "127.0.0.1:${BLOODHOUND_PORT}:8080"
    restart: always
volumes:
  terminal-workspace:
  open-webui-data:
  postgres_data:
  neo4j_data:
  neo4j_logs:

networks:
  workbench:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
