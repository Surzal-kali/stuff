# =============================================================================
# Framework workbench: Open Terminal (network-isolated) + existing ChromaDB
#
# The open-terminal container has the full framework baked in but can only
# reach ChromaDB (Docker-internal) and Ollama (10.0.0.245:11434). All other
# outbound traffic is blocked by iptables in the entrypoint.
#
# ChromaDB is now defined below as the `chroma` service — it mirrors the
# previous standalone `chroma` container (same image, same config.yaml,
# same `chroma-data` bind mount, host port 9000).  open-terminal reaches it
# by DNS name `chroma` on the workbench network.  See the note above the
# service block about removing the standalone container first.
#
# Usage:
#   cd dockered
#   ./up.sh                  # builds + starts (removes legacy chroma first)
#
#   # or manually:
#   docker rm -f chroma       # clear the standalone container if present
#   docker compose up -d --build
#
# Open Terminal API:  http://localhost:8000   (connect Open WebUI here)
# Framework gateway:  http://localhost:6000   (REST + MCP, from host)
#
# Override API keys via shell env or a dockered/.env file:
#   OPEN_TERMINAL_API_KEY=your-key
#   GATEWAY_API_KEY=your-key
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────
  # ChromaDB — mirrored from the existing standalone `chroma` container so the
  # workbench is self-contained.  Service name `chroma` is the DNS name on the
  # workbench network, matching CHROMA_HOST=chroma in framework.env.
  #
  # Before `docker compose up`, stop/remove the standalone container to avoid a
  # host port-9000 / container-name collision:
  #   docker rm -f chroma
  # ─────────────────────────────────────────────────────────────────────────
  chroma:
    image: chromadb/chroma
    command: ["run", "/config.yaml"]
    ports:
      - "9000:8000"      # host 9000 -> container 8000 (matches existing mapping)
    networks:
      workbench:
        ipv4_address: 172.28.0.10
    volumes:
      - ../chroma-data:/data          # reuse the existing on-disk vector store
      - ./chroma-config.yaml:/config.yaml:ro
    restart: unless-stopped

  open-terminal:
    build:
      context: ..
      dockerfile: dockered/open-terminal.Dockerfile
    ports:
      - "8000:8000"    # Open Terminal API (connect Open WebUI here)
      - "6000:6000"    # Framework REST + MCP gateway (debug from host)
    networks:
      workbench:
        ipv4_address: 172.28.0.20
    cap_add:
      - NET_ADMIN       # needed only for entrypoint iptables setup
    env_file:
      - framework.env
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:-changeme-terminal-key}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-changeme-gateway-key}
    volumes:
      - terminal-workspace:/home/user        # agent workspace (ephemeral files)
      - framework-memory:/opt/framework/.memory  # persistent vector memory
    restart: unless-stopped

networks:
  workbench:
    name: workbench
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  terminal-workspace:
  framework-memory:
